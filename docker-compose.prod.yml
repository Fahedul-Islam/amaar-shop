services:
  postgres:
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes: []
    ports:
      - "80:3000"
    environment:
      - BACKEND_URL=http://backend:8080

  adminer:
    profiles:
      - debug

volumes:
  upload_data:
