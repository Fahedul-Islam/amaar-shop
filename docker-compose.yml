services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amaarshop}
      POSTGRES_USER: ${POSTGRES_USER:-amaarshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amaarshop_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amaarshop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-amaarshop}:${POSTGRES_PASSWORD:-amaarshop_secret}@postgres:5432/${POSTGRES_DB:-amaarshop}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@amaarshop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: "8080"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./backend/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-amaarshop}:${POSTGRES_PASSWORD:-amaarshop_secret}@postgres:5432/${POSTGRES_DB:-amaarshop}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  go_mod_cache:
  go_build_cache:
  upload_data:
